<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revenue Command Center</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:1250px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:17px;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:27px;font-weight:800}.muted{font-size:12px;color:#667085}.btn{padding:8px 11px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#175cd3;color:#fff}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.pill{padding:4px 8px;border-radius:99px;font-size:10px;font-weight:700}.high{background:#fee4e2;color:#b42318}.warn{background:#fef0c7;color:#b54708}.ok{background:#dcfae6;color:#067647}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:13px;padding:20px;max-width:900px;width:100%;max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form input,.form select,.form textarea{padding:9px;border:1px solid #d0d5dd;border-radius:7px;width:100%;box-sizing:border-box}.form textarea{grid-column:1/-1;height:90px}.notice{padding:10px;border:1px solid #fedf89;background:#fffaeb;border-radius:8px;margin:6px 0;font-size:12px}.timeline{border-left:2px solid #eaecf0;padding-left:15px}.event{margin:12px 0;font-size:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{padding:8px 10px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}.tab.active{background:#101828;color:#fff}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
let token=localStorage.rccToken||"", currentTab="queue";
const api=async(p,o={})=>{o.headers=Object.assign({"Content-Type":"application/json","Authorization":"Bearer "+token},o.headers||{});let r=await fetch(p,o),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j};
function loginView(){app.innerHTML=`<div class="card" style="max-width:390px;margin:12vh auto"><h2>Revenue Command Center</h<div class="muted">Revenue Cycle Management • Claims • Denials • Appeals • Deadlines</div><p><input id="e" style="width:100%;padding:10px;box-sizing:border-box" value="admin@demo.local"></p><p><input id="p" type="password" style="width:100%;padding:10px;box-sizing:border-box" value="ChangeMe123!"></p><button class="btn primary" onclick="login()">Sign in</button><p class="muted">Synthetic demo only. Do not enter PHI.</p></div>`}
async function login(){try{let x=await api("/api/login",{method:"POST",body:JSON.stringify({email:e.value,password:p.value})});token=x.token;localStorage.rccToken=token;render()}catch(x){alert(x.message)}}
async function render(){if(!token)return loginView();try{let [me,d,c,w,n]=await Promise.all([api("/api/me"),api("/api/dashboard"),api("/api/claims"),api("/api/work-items"),api("/api/notifications")]);app.innerHTML=`<div class="wrap"><header style="display:flex;justify-content:space-between;gap:10px;align-items:start"><di<h1>Hospital Revenue Command Center <small style="font-size:12px">v1.0</small></h1><div class="muted">${me.user.role} • ${me.user.organization_id}</div></div><button class="btn" onclick="logout()">Log out</button></header>
<div class="grid"><div class="card"><div class="muted">Claims</div><div class="metric">${d.claims}</div></div><div class="card"><div class="muted">Denied value</div><div class="metric" style="color:#b42318">$${Math.round(d.denied_value).toLocaleString()}</div></div><div class="card"><div class="muted">Illustrative opportunity</div><div class="metric" style="color:#067647">$${Math.round(d.opportunity).toLocaleString()}</div></div><div class="card"><div class="muted">Deadline alerts</div><div class="metric" style="color:#b54708">${d.deadline_alerts}</div></div></div>
${n.notifications.filter(x=>!x.read).slice(0,5).map(x=>`<div class="notice"><b>${x.title}</b> — ${x.message} <button class="btn" onclick="readNotice(${x.id})">Mark read</button></div>`).join("")}
<div class="tabs">
<button class="tab ${currentTab==='queue'?'active':''}" onclick="tab('queue')">Claim Queue</button>
<button class="tab ${currentTab==='denials'?'active':''}" onclick="tab('denials')">Denial Management</button>
<button class="tab ${currentTab==='work'?'active':''}" onclick="tab('work')">Work Items</button>
<button class="tab ${currentTab==='docs'?'active':''}" onclick="tab('docs')">Documents</button>
<button class="tab ${currentTab==='audit'?'active':''}" onclick="tab('audit')">Audit Trail</button>
</div>
<button class="tab ${currentTab==='queue'?'active':''}" onclick="tab('queue')">Claim Queue</button><button class="tab ${currentTab==='work'?'active':''}" onclick="tab('work')">Work Items</button><button class="tab ${currentTab==='docs'?'active':''}" onclick="tab('docs')">Documents</button><button class="tab ${currentTab==='audit'?'active':''}" onclick="tab('audit')">Audit Trail</button></div>
<div id="content"></div><div class="card"><b>Production boundary:</b> This prototype uses synthetic records. Before PHI, add hardened identity, encryption, centralized immutable audit logging, risk analysis, testing, backups, incident response, contractual/BAA requirements, and authorized EHR/payer integrations.</div></div>`;await loadTab(c,w)}catch(x){token="";localStorage.removeItem("rccToken");loginView()}}
function tab(t){currentTab=t;render()}
async function loadTab(c,w){
let el=document.getElementById("content");
if(currentTab==="denials"){
    let denied=c.claims.filter(x=>x.status==="Denied");
    let total=denied.reduce((sum,x)=>sum+x.amount,0);
    let categories={};
    denied.forEach(x=>{
        categories[x.category]=(categories[x.category]||0)+x.amount;
    });
    let rows=Object.entries(categories)
        .sort((a,b)=>b[1]-a[1])
        .map(([category,amount])=>`
            <tr>
                <td><b>${category}</b></td>
                <td>${denied.filter(x=>x.category===category).length}</td>
                <td><b>$${Math.round(amount).toLocaleString()}</b></td>
            </tr>
        `).join("");
    el.innerHTML=`
    <div class="card">
        <h2>Denial Management</h2>
        <div class="grid">
            <div class="card">
                <div class="muted">Denied Claims</div>
                <div class="metric">${denied.length}</div>
            </div>
            <div class="card">
                <div class="muted">Denied Value</div>
                <div class="metric" style="color:#b42318">
                    $${Math.round(total).toLocaleString()}
                </div>
            </div>
            <div class="card">
                <div class="muted">Illustrative Recovery</div>
                <div class="metric" style="color:#067647">
                    $${Math.round(total*.22).toLocaleString()}
                </div>
            </div>
            <div class="card">
                <div class="muted">High Priority</div>
                <div class="metric">
                    ${denied.filter(x=>x.priority==="High").length}
                </div>
            </div>
        </div>
    </div>
    <div class="card">
        <h3>Denials by Category</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Denial Category</th>
                    <th>Claims</th>
                    <th>Denied Value</th>
                </tr>
            </thead>
            <tbody>
                ${rows || '<tr><td colspan="3">No denied claims.</td></tr>'}
            </tbody>
        </table>
    </div>
    <div class="card">
        <h3>Priority Denials</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Claim</th>
                    <th>Payer</th>
                    <th>Reason</th>
                    <th>Amount</th>
                    <th>Deadline</th>
                    <th>Owner</th>
                </tr>
            </thead>
            <tbody>
                ${denied
                    .filter(x=>x.priority==="High")
                    .map(x=>`
                    <tr>
                        <td>#${x.id}</td>
                        <td>${x.payer}</td>
                        <td>${x.category}</td>
                        <td><b>$${x.amount.toLocaleString()}</b></td>
                        <td>${x.deadline}</td>
                        <td>${x.owner}</td>
                    </tr>
                    `).join("")}
            </tbody>
        </table>
    </div>
    `;
}

else if(currentTab==="queue"){el.innerHTML=`<div class="card"><h2>Claim Work Queue</h2><table class="table"><thead><tr><th>Priority</th><th>Claim</th><th>Payer</th><th>Amount</th><th>Status</th><th>Issue</th><th>Department</th><th>Deadline</th><th>Owner</th><th></th></tr></thead><tbody>${c.claims.map(x=>`<tr><td><span class="pill ${x.priority==='High'?'high':'warn'}">${x.priority}</span></td><td>#${x.id}</td><td>${x.payer}</td><td><b>$${x.amount.toLocaleString()}</b></td><td>${x.status}</td>
<td>${x.category}</td>
<td>${x.department || "Unassigned"}</td>
<td>${x.deadline}</td>
<td>${x.owner}</td>
<td><button class="btn primary" onclick='openClaim(${JSON.stringify(x)})'>Work</button></td></tr>`).join("")}</tbody></table></div>`}
else if(currentTab==="work"){el.innerHTML=`<div class="card"><h2>Work Items</h2><table class="table"><thead><tr><th>Claim</th><th>Status</th><th>Assigned</th><th>Note</th><th>Updated</th></tr></thead><tbody>${w.work_items.map(x=>`<tr><td>#${x.claim_id}</td><td>${x.status}</td><td>${x.assigned_to}</td><td>${x.notes}</td><td>${x.updated_at.slice(0,19)}</td></tr>`).join("")}</tbody></table></div>`}
else if(currentTab==="docs"){let d=await api("/api/documents");el.innerHTML=`<div class="card"><h2>Document Index</h2><p class="muted">v0.9 stores demo text attachments. Production should use encrypted object storage with malware scanning, access controls, retention, and content-disposition protections.</p><table class="table"><thead><tr><th>Claim</th><th>Filename</th><th>Type</th><th>Created</th></tr></thead><tbody>${d.documents.map(x=>`<tr><td>#${x.claim_id}</td><td>${x.filename}</td><td>${x.content_type}</td><td>${x.created_at.slice(0,19)}</td></tr>`).join("")||'<tr><td colspan="4">No demo documents yet.</td></tr>'}</tbody></table></div>`}
else {let a=await api("/api/audit");el.innerHTML=`<div class="card"><h2>Audit Trail</h2><div class="timeline">${a.events.map(x=>`<div class="event"><b>${x.action}</b> • ${x.resource}<br><span class="muted">${x.created_at} • user ${x.user_id}</span></div>`).join("")}</div></div>`}}
async function openClaim(c){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="m"><div class="box"><div style="display:flex;justify-content:space-between"><div><h2>Claim #${c.id}</h2><div class="muted">${c.payer} • ${c.category}</div></div><button class="btn" onclick="m.remove()">Close</button></div><div class="grid"><div class="card"><div class="muted">Amount</div><div class="metric">$${c.amount.toLocaleString()}</div></div><div class="card"><div class="muted">Status</div><div class="metric" style="font-size:18px">${c.status}</div></div><div class="card"><div class="muted">Deadline</div><div class="metric" style="font-size:18px">${c.deadline}</div></div><div class="card"><div class="muted">Owner</div><div class="metric" style="font-size:18px">${c.owner}</div></div></div><h3>Action</h3><div class="form"><label>Action<select id="act"><option value="status">Change status</option><option value="assign">Assign owner</option><option value="appeal">Prepare appeal</option><option value="note">Add note</option><option value="document">Add document</option></select></label><label id="statusBox">New status<select id="status"><option>Pending</option><option>Denied</option><option>Appeal Prepared</option><option>Appealed</option><option>Resolved</option></select></label><label id="ownerBox" style="display:none">Owner<input id="owner" value="${c.owner}"></label><input id="filename" style="display:none" placeholder="document filename"><textarea id="note" placeholder="Action/review note"></textarea></div><p><button class="btn primary" onclick="submitAction('${c.id}')">Save & audit</button></p><h3>Timeline</h3><div id="timeline" class="timeline">Loading…</div></div></div>`);act.onchange=()=>{statusBox.style.display=act.value==="status"?"block":"none";ownerBox.style.display=(act.value==="assign"||act.value==="appeal")?"block":"none";filename.style.display=act.value==="document"?"block":"none"};let ev=await api("/api/claims/"+c.id+"/events");timeline.innerHTML=ev.events.map(x=>`<div class="event"><b>${x.action}</b> ${x.from_status||""} → ${x.to_status||""}<br>${x.note||""}<br><span class="muted">${x.created_at}</span></div>`).join("")||'<div class="muted">No events.</div>'}
async function submitAction(id){let action=act.value;if(action==="document"){try{await api("/api/claims/"+id+"/documents",{method:"POST",body:JSON.stringify({filename:filename.value||"review-note.txt",content_type:"text/plain",content:note.value})});m.remove();render()}catch(e){alert(e.message)}return}let x={action,note:note.value};if(action==="status")x.status=status.value;if(action==="assign"||action==="appeal")x.owner=owner.value;try{await api("/api/claims/"+id+"/action",{method:"POST",body:JSON.stringify(x)});m.remove();render()}catch(e){alert(e.message)}}
async function readNotice(id){await api("/api/notifications/read",{method:"POST",body:JSON.stringify({id})});render()}
async function logout(){try{await api("/api/logout",{method:"POST"})}catch(e){}token="";localStorage.removeItem("rccToken");render()}render();
</script></body></html>
